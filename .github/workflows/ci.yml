# CI workflow for greengrass-publisher
#
# Two jobs: typecheck (mypy --strict) and test (pytest matrix over
# Python 3.11 and 3.12).
#
# This used to check out event-schema-contracts' and
# structured-logging-python's repositories as siblings and join them onto
# PYTHONPATH, because those packages were private and could not be pip
# installed from a workflow — actions/checkout with the default token
# cannot read another private repository, so the checkouts failed and the
# jobs never ran.
#
# Both are public now, so they are declared as ordinary dependencies in
# pyproject.toml and pip fetches them. That is better than a sibling
# checkout regardless of the credential problem: a declared dependency
# records which version this package was built against, while a PYTHONPATH
# entry silently picks up whatever happens to be beside it.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: mypy
        run: mypy greengrass_publisher

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q
